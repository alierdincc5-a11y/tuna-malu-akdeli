<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tuna Mal Oyunu</title>

<style>
body{
    margin:0;
    background:#222;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    color:gold;
}

#game{
    width:600px;
    margin:auto;
    padding:20px;
    background:#333;
    border-radius:15px;
}

button{
    padding:10px 20px;
    margin:5px;
    font-size:18px;
    cursor:pointer;
}

#money{
    color:lime;
}

#level{
    color:orange;
}
</style>
</head>
<body>

<h1>🏪 Tuna Mal Oyunu</h1>

<div id="game">

<h2>Para: <span id="money">50</span> ₺</h2>
<h2>Level: <span id="level">1</span></h2>

<button onclick="sat()">📦 Mal Sat</button>
<button onclick="yukselt()">⬆️ Marketi Geliştir</button>
<button onclick="gorev()">🎯 Görev Yap</button>

<p id="mesaj">İşine başla!</p>

</div>

<script>

let para=50;
let level=1;
let market=1;

function guncelle(){
    document.getElementById("money").innerText=para;
    document.getElementById("level").innerText=level;
}

function sat(){
    let kazanc=Math.floor(Math.random()*20)+10;
    para += kazanc*market;

    document.getElementById("mesaj").innerHTML=
    "📦 Satış yaptın! +" + (kazanc*market) +" ₺";

    if(para>=level*500){
        level++;
        document.getElementById("mesaj").innerHTML=
        "⭐ Level Atladın! Level "+level;
    }

    guncelle();
}

function yukselt(){

    let fiyat=100*market;

    if(para>=fiyat){
        para-=fiyat;
        market++;
        document.getElementById("mesaj").innerHTML=
        "🏪 Market geliştirildi! Seviye "+market;
    }
    else{
        document.getElementById("mesaj").innerHTML=
        "❌ Paran yetmiyor!";
    }

    guncelle();
}

function gorev(){

    let odul=Math.floor(Math.random()*100)+50;

    para+=odul;

    document.getElementById("mesaj").innerHTML=
    "🎯 Görev tamamlandı! +" + odul + " ₺";

    guncelle();
}

guncelle();

</script>

</body>
</html>
